services:
  # Unified Full-Stack Service (FastAPI + React Frontend)
  - type: web
    name: aihire
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./aihire.db
      - key: PYTHONPATH
        value: backend
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.9
