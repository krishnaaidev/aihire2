version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aihire_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./aihire.db
      - SECRET_KEY=aihire_super_secret_jwt_key_2026_secure
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/aihire.db:/app/aihire.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aihire_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
